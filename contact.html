    <!-- Contact Section -->
    <section class="contact-section">
        <div class="container">
            <h1>Hubungi Saya</h1>
            <p class="section-subtitle">Saya terbuka untuk diskusi, kolaborasi, atau pertanyaan apapun</p>

            <div class="contact-content">
                <!-- Contact Form -->
                <div class="contact-form-wrapper">
                    <form class="contact-form" id="contactForm">
                        <div class="form-group">
                            <label for="name">Nama Lengkap</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="subject">Subjek</label>
                            <input type="text" id="subject" name="subject" required>
                        </div>

                        <div class="form-group">
                            <label for="message">Pesan</label>
                            <textarea id="message" name="message" rows="6" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Kirim Pesan</button>
                    </form>
                </div>

                <!-- Contact Info -->
                <div class="contact-info">
                    <div class="info-card">
                        <h3>Email</h3>
                        <p><a href="mailto:624C0013@gmail.com">624C0013@gmail.com</a></p>
                    </div>

                    <div class="info-card">
                        <h3>Telepon</h3>
                        <p><a href="tel:083154611511">083154611511</a></p>
                    </div>

                    <div class="info-card">
                        <h3>Media Sosial</h3>
                        <div class="social-links-vertical">
                            <a href="https://github.com/624c0013" target="_blank" rel="noopener noreferrer">GitHub</a>
                            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">Instagram</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
